<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ctrlx AI Detector - Login</title>
  <link href="{{url_for('static', filename='bootstrap/bootstrap.min.css')}}" rel="stylesheet">
  <link href="{{url_for('static', filename='bootstrap/main-style.css')}}" rel="stylesheet">
  <script src="{{url_for('static', filename='bootstrap/bootstrap.min.js')}}"></script>
  <script src="{{url_for('static', filename='bootstrap/jquery.min.js')}}"></script>
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      padding: 3rem;
      max-width: 450px;
      width: 90%;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .login-logo {
      height: 60px;
      width: auto;
    }

    .login-title {
      color: var(--primary-blue);
      font-size: 1.8rem;
      font-weight: 700;
      margin: 1rem 0 0.5rem 0;
    }

    .login-subtitle {
      color: var(--medium-gray);
      font-size: 1rem;
    }

    .login-form {
      margin-top: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      color: var(--dark-gray);
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .login-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 4px rgba(0, 86, 145, 0.1);
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
      color: white;
      border: none;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 86, 145, 0.4);
    }

    .login-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e0e0e0;
      color: var(--medium-gray);
      font-size: 0.9rem;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo-container">
      <img src="{{url_for('static', filename='image/rexroth.png')}}" alt="Bosch Rexroth Logo" class="login-logo">
    </div>
    <h1 class="login-title">AI Detector</h1>
    <p class="login-subtitle">Please sign in to continue</p>
  </div>

  {% if 'error' in result %}
  <div class="alert">
    Invalid credentials. Please try again.
  </div>
  {% endif %}

  <form method="post" action="{{ url_for('login_post') }}" class="login-form">
    <div class="form-group">
      <label for="login" class="form-label">Username</label>
      <input type="text" id="login" name="email" placeholder="Enter your username" class="login-input" required>
    </div>

    <div class="form-group">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" class="login-input" required>
    </div>

    <button type="submit" class="login-btn">Log In</button>
  </form>

  <div class="login-footer">
    &copy; 2025 Bosch Rexroth VN
  </div>
</div>

</body>
</html>
