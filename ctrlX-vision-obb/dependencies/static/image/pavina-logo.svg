<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Background gradient matching header -->
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="100" fill="url(#headerGradient)" rx="5"/>

  <!-- Green leaf icon -->
  <path d="M 45 50 Q 35 30, 50 20 Q 55 30, 45 50" fill="#28a745" opacity="0.8"/>
  <path d="M 45 50 Q 55 30, 40 20 Q 35 30, 45 50" fill="#1e7e34" opacity="0.8"/>
  <circle cx="45" cy="50" r="3" fill="#2c5234"/>

  <!-- PAVINA text -->
  <text x="75" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">PAVINA</text>

  <!-- Green Automation text -->
  <text x="75" y="70" font-family="Arial, sans-serif" font-size="14" fill="#28a745">Green Automation</text>

  <!-- Decorative line -->
  <line x1="75" y1="52" x2="270" y2="52" stroke="#28a745" stroke-width="1.5" opacity="0.5"/>
</svg>
